name: Unzip Roulette PWA

on:
  workflow_dispatch:
  push:
    paths:
      - 'roulette-pwa.zip'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Unzip and move files to root
        run: |
          if [ -f "roulette-pwa.zip" ]; then
            # Temporary folder me extract karo
            unzip -q roulette-pwa.zip -d temp_extract
            echo "Extracted to temp folder"
            
            # Agar roulette-pwa folder hai to uske contents root me move karo
            if [ -d "temp_extract/roulette-pwa" ]; then
              cp -r temp_extract/roulette-pwa/* .
              cp -r temp_extract/roulette-pwa/.* . 2>/dev/null || true
              echo "Moved files from roulette-pwa folder to root"
            else
              # Agar direct files hain to unhe root me copy karo
              cp -r temp_extract/* .
              cp -r temp_extract/.* . 2>/dev/null || true
              echo "Moved files directly to root"
            fi
            
            # Cleanup
            rm -rf temp_extract
            rm -f roulette-pwa.zip
            
            echo "Current directory contents:"
            ls -la
          else
            echo "roulette-pwa.zip not found in repository"
            exit 1
          fi
      
      - name: Commit and push extracted files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Extract files to root and remove roulette-pwa folder" || echo "No changes to commit"
          git push
