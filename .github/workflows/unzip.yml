name: Unzip Roulette PWA

on:
  workflow_dispatch:
  push:
    paths:
      - 'roulette-pwa.zip'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Unzip roulette-pwa.zip to root
        run: |
          if [ -f "roulette-pwa.zip" ]; then
            unzip -o roulette-pwa.zip -d .
            echo "Successfully extracted roulette-pwa.zip to root directory"
            ls -la
          else
            echo "roulette-pwa.zip not found in repository"
            exit 1
          fi
      
      - name: Commit and push extracted files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Extract roulette-pwa.zip contents to root" || echo "No changes to commit"
          git push
